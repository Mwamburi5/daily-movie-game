<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- W5e: no zoom lock — pinch-zoom must stay available (WCAG 1.4.4); the
         board's smallest labels need it. iOS ignored the lock anyway; Android
         Chrome enforced it, which walled off low-vision players. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4efe6" />
    <!-- Quiet phase (WS1): keep the alias out of search indexes until launch. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Match Cut</title>
    <!-- Ticket-stub mark (§7·7c — there was no favicon at all). SVG first,
         32px PNG for older tab strips, 180px for iOS home-screen saves (iOS
         applies its own corner mask, so that one is full-bleed navy). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Stub type stack: preloads land with the W1 port (the @font-face rules
         in index.css were inert until the wired components referenced them). -->
    <link rel="preload" href="/fonts/domine-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-400-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-600-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Vercel Web Analytics via the script-tag route (deps are locked — no
         @vercel/analytics). The stub queues events in window.vaq until the
         deferred script loads; it silently never loads off-Vercel. Custom
         events fire through src/lib/analytics.ts. -->
    <script>
      window.va =
        window.va ||
        function () {
          ;(window.vaq = window.vaq || []).push(arguments)
        }
      // Vercel serves this endpoint only on deployed builds. Loading it through
      // the local Vite server creates a guaranteed 404 and a false-red console;
      // install the same deferred collector only away from local development.
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        const analyticsScript = document.createElement('script')
        analyticsScript.defer = true
        analyticsScript.src = '/_vercel/insights/script.js'
        document.head.appendChild(analyticsScript)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
