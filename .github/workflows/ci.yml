name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  build-and-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use repository Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Enforce bundle budgets
        run: npm run check:bundle

  duel-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use repository Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Duel parity
        run: npm run verify

  daily-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use repository Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Solo
        run: npm run verify:solo

      - name: Verify Chronology
        run: npm run verify:chronology

  connections-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use repository Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Connections
        run: npm run verify:connections

  browser-smoke:
    needs:
      - build-and-budgets
      - duel-rules
      - daily-rules
      - connections-rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use repository Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:smoke
