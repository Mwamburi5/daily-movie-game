name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  delivery-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Enforce bundle budgets
        run: npm run check:bundle

      - name: Verify Duel parity
        run: npm run verify

      - name: Verify Solo
        run: npm run verify:solo

      - name: Verify Chronology
        run: npm run verify:chronology

      - name: Verify Connections
        run: npm run verify:connections

  browser-smoke:
    needs: delivery-and-rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:smoke
